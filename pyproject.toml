[project]
name = "spotify-lakehouse"
version = "1.0.0"
description = "Spotify playlist lakehouse on Databricks (medallion architecture)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Globals that Databricks injects into notebooks
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import after the sys.path setup cell
"src/notebooks/**" = ["E402", "I001"]
